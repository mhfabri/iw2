<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <div>
        <h1>Exercicio 1</h1>
        <input type="text" placeholder="digite..." id="digite">
        <button type="button" id="submit" onclick="submit()">Enviar</button>
        <p id="txt">Substituir texto</p>
    </div>

    <div>
        <h1>Exercicio 2</h1>
        <input type="text" id="nome" placeholder="digite seu nome...">
        <button type="button" id="submit2" onclick="submit2()">Enviar</button>
        <p id="txt2"></p>
    </div>

    <div>
        <h1>Exercicio 3</h1>
        <input type="number" id="numero" placeholder="digite um número...">
        <button type="button" id="submit3" onclick="submit3()">Enviar</button>
        <p id="txt3"></p>
    </div>

    <div>
        <h1>Exercicio 4</h1>
        <button type="button" id="backcolor" onclick="changeBackgroundColor()">Mudar Cor de Fundo</button>
        <input type="color" id="color" value="#ffffff">
    </div>

    <div>
        <h1>Exercicio 5</h1>
        <label for="blackwhite">Modo Escuro</label>
        <input type="checkbox" id="blackwhite" onclick="toggleBackgroundColor()">
    </div>

    <div>
        <h1>Exercicio 6 e 7</h1>
        <input type="text" id="inputTexto" placeholder="Digite algo">
        <button onclick="adicionarItem()">Adicionar</button>

        <ul id="lista"></ul>
    </div>

    <div>
        <h1>
            Exercicio 8
        </h1>
        <input type="number" id="parimpar" placeholder="Número 1">
        <button type="button" onclick="checkParImpar()">Verificar</button>
        <p id="txtParImpar"></p>
    </div>

    <div>
        <h1>Exercicio 9</h1>
        <input type="password" id="senha" placeholder="Digite sua senha">
        <button type="button" onclick="verificarSenha()">Verificar</button>
    </div>

    <div>
        <h1>Exercicio 10</h1>
        <input type="text" id="dgtNome" placeholder="Digite um nome...">
        <button type="button" onclick="addNome()">Adicionar Nome</button>
        <label for="">clique no nome para excluir</label>

        <ol id="listaNomes">

        </ol>
    </div>

</body>

</html>
